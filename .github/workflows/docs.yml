name: Build docs

on:
  push:
    branches: [main]
    paths: ["docs/**.tex", ".github/workflows/docs.yml"]
  pull_request:
    paths: ["docs/**.tex"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  latex:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile LaTeX
        uses: xu-cheng/latex-action@v3
        with:
          root_file: |
            documentation.tex
            proposal.tex
          working_directory: docs

      - name: Upload PDFs
        uses: actions/upload-artifact@v4
        with:
          name: docs-pdf
          path: docs/*.pdf

      # Keep a rolling "latest" release so the README can link straight to the PDFs.
      - name: Publish to "docs-latest" release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: docs-latest
          name: Documentation (latest build)
          body: Automatically built from `docs/*.tex` on commit ${{ github.sha }}.
          prerelease: true
          files: docs/*.pdf
